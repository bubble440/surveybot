/*=============================================================================*
 テキストフィールドの誤送信防止処理
 *=============================================================================*/

/*-----------------------------------------------------------------------------*
 テキストフィールドを検出し、関数の呼び出しを組み込む
 *-----------------------------------------------------------------------------*/
function attachBlockSubmit( form_id ) {
	var elements = document.forms[form_id].elements;
	for (var i=0; i < elements.length; i++) {
		var e = elements[i];	
		if (e.type == 'text'){
			e.onkeypress=KeyPressBlock;
		}
	}
}

/*-----------------------------------------------------------------------------*
 エンターキーの入力時に無効化
 *-----------------------------------------------------------------------------*/
function KeyPressBlock( evt ){
	evt = ( evt ) ? evt : event; 
	var charCode= ( evt.charCode ) ? evt.charCode : 
		( ( evt.which ) ? evt.which : evt.keyCode );
	if ( Number( charCode ) == 13 || Number( charCode ) == 3) {
		return false;
	} else {
		return true;
	}
}

/*=============================================================================*
 window.onload に関数を追加登録する関数
 *=============================================================================*/

function addOnload(entry) {
	var stack = window.onload;
	
	if(typeof window.onload != 'function') {
		window.onload = entry;
	}
	else {
		window.onload = function() {
			stack();
			entry();
		};
	}
}
var miz_part = 1508284;
var miz_page = 1;
var miz_auto = false;
var enquete_id = 796295;

var miz_cookie_time;
if($.cookie("p2_timerpage"+enquete_id)){
	var miz_array = $.cookie("p2_timerpage"+enquete_id).split("/");
	// 違うページのCookieだった場合は消す
	if(miz_array[0] != miz_part || miz_array[1] != miz_page){
		$.removeCookie("p2_timerpage"+enquete_id, { path: "/" });
	}
	// 使えるCookieがある（強制送信の場合はCookieが設定されていない）
	else{
		// 許容範囲（1日）内
		// miz_cookie_timeに何も入らなければあとで「今の時間を使いCookieを設定」される
		if(new Date().getTime() < (1000*60*60*24) + parseInt(miz_array[2],10)){
			miz_cookie_time = parseInt(miz_array[2],10);
		}
	}
}

var chkSubmit = false; 
var isSubmit = false;

			alert( 'L’adresse e-mail est incorrecte. Veuillez revérifier.' );
			return false;
		}
	}
	document.formQ[btnName].value = 'val'; 
chkSubmit = true; 
isSubmit = true; 
document.formQ.submit(); 
return true; 
}
