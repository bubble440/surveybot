<script type="text/template" class="template" id="single-template">
    <div class="options js-resize-choices js-question-options">
        {% _.each(model.QuestionOptions, function(child, i) { %}
                <label for="option-##i##" class="radio{% if (child.ParentItem != null) { %} collection" data-parent="## child.ParentItem ##{% } %}">
                    <input type="radio" id="option-##i##" name="question_##model.QuestionId##" value="##child.Precode##"/>
                    <span>##child.Display##</span>
                </label>
        {% }); %} 
    </div>    
</script>

<script type="text/template" class="template" id="multi-template">
    <div class="options js-resize-choices js-question-options">

            <label for="option-##i##" class="checkbox">
                <input type="checkbox" id="option-##i##" name="question_##model.QuestionId##" value="##child.Precode##" {% if (child.IsMutuallyExclusive) { %} class="exclusive" {% } %}/>
                <span>##child.Display##</span>

        {% }); %} 
    </div>
</script>

                                <input type="radio" id="option-##sId##-##oId##" name="##subquestion.Code##" value="##child.Precode##"/>
                                <span>##child.Display##</span>
                            </label>
                    {% }); %} 
                </div>  
            </li>
        {% }); %}  
        </ul>
    {% } %}        
</script>
