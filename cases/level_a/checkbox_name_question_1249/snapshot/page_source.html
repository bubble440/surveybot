<script type="text/template" class="template" id="single-template">
    <div class="options js-resize-choices js-question-options">
        {% _.each(model.QuestionOptions, function(child, i) { %}
                <label for="option-##i##" class="radio{% if (child.ParentItem != null) { %} collection" data-parent="## child.ParentItem ##{% } %}">
                    <input type="radio" id="option-##i##" name="question_##model.QuestionId##" value="##child.Precode##"/>
                    <span>##child.Display##</span>
                </label>
        {% }); %} 
    </div>    
</script>

<script type="text/template" class="template" id="multi-template">
    <div class="options js-resize-choices js-question-options">
        {% _.each(model.QuestionOptions, function(child, i) { %}
            <label for="option-##i##" class="checkbox">
                <input type="checkbox" id="option-##i##" name="question_##model.QuestionId##" value="##child.Precode##" {% if (child.IsMutuallyExclusive) { %} class="exclusive" {% } %}/>
                <span>##child.Display##</span>
            </label>
        {% }); %} 
    </div>
</script>

<script type="text/template" class="template" id="grid-mobile-template">
    
    {% if (model.SubQuestions) { %}
        <input type="hidden" name="This needs to change" value="-1"/>
        <ul class="grid-answers">
        {% _.each(model.SubQuestions, function(subquestion, sId) { %}
            <li class="subquestion">
                <div class="label">##subquestion.Display##</div>
                <div class="options js-resize-choices js-question-options">
                    {% _.each(model.QuestionOptions, function(child, oId) { %}
                            <label for="option-##sId##-##oId##" class="radio">
                                <input type="radio" id="option-##sId##-##oId##" name="##subquestion.Code##" value="##child.Precode##"/>
                                <span>##child.Display##</span>
                            </label>
                    {% }); %} 
                </div>  
            </li>
        {% }); %}  
        </ul>
    {% } %}        
</script>

<script type="text/template" class="template" id="grid-desktop-template">
    {% $('body').addClass('grid'); %}
    {% var columnWidth = 75 / model.QuestionOptions.length; %}

    {% if (model.SubQuestions) { %}
        <input type="hidden" name="This needs to change" value="-1"/>
        <table class="grid-question">
            <thead>
                <tr>
                    <th></th>
                    {% _.each(model.QuestionOptions, function(child, oId) { %}
                        <th>
                            <span>##child.Display##</span>
                        </th>
                    {% }); %}
                </tr>
            </thead>
            <tbody>
                {% _.each(model.SubQuestions, function(subquestion, sId) { %}
                    <tr class="js-question-options">
                        <td class="row-label"><span class="label">##subquestion.Display##</span></td>
                        {% _.each(model.QuestionOptions, function(child, oId) { %}
                            <td width="##columnWidth##%">
                                <label for="option-##sId##-##oId##"><input type="radio" id="option-##sId##-##oId##" name="##subquestion.Code##" value="##child.Precode##"/></label>
                            </td>
                        {% }); %}
                    </tr>
                {% }); %}
            </tbody>
        </table>
    {% } %}  
</script>
